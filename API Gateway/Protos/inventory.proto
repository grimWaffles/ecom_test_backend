syntax = "proto3";

option csharp_namespace = "ApiGateway.Protos";

import "google/protobuf/timestamp.proto";

message InventoryMessage {
  int64 id = 1;
  int32 product_id = 2;
  int32 product_category_id = 3;
  int32 quantity = 4;

  int32 created_by = 5;
  google.protobuf.Timestamp created_date = 6;

  optional int32 modified_by = 7;
  optional google.protobuf.Timestamp modified_date = 8;

  bool is_deleted = 9;
}

message InventoryUpsertMessage {
  int64 id = 1;
  int32 product_id = 2;
  int32 product_category_id = 3;
  int32 quantity = 4;
}

// ---- Request messages ----

message GetAllInventoryRequest {
  int32 page_number = 1;
  int32 page_size = 2;
}

message GetInventoryByProductIdRequest {
  int32 product_id = 1;
}

message CreateInventoryRequest {
  InventoryUpsertMessage inventory = 1;
  int32 user_id = 2;
}

message UpdateInventoryRequest {
  InventoryUpsertMessage inventory = 1;
  int32 user_id = 2;
}

message DeleteInventoryRequest {
  int32 id = 1;
  int32 user_id = 2;
}

message GetInventoryByProductCategoryRequest {
  int32 product_category_id = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

// ---- Response messages ----

message InventoryListResponse {
  repeated InventoryMessage items = 1;
}

message InventoryResponse {
  InventoryMessage inventory = 1;
}

message DeleteInventoryResponse {
  bool success = 1;
}

// ===================== Service =====================

service InventoryService {
  rpc GetAllInventory (GetAllInventoryRequest) returns (InventoryListResponse);
  rpc GetInventoryByProductId (GetInventoryByProductIdRequest) returns (InventoryListResponse);
  rpc CreateInventory (CreateInventoryRequest) returns (InventoryResponse);
  rpc UpdateInventory (UpdateInventoryRequest) returns (InventoryResponse);
  rpc DeleteInventory (DeleteInventoryRequest) returns (DeleteInventoryResponse);
  rpc GetInventoryByProductCategory (GetInventoryByProductCategoryRequest) returns (InventoryListResponse);
}