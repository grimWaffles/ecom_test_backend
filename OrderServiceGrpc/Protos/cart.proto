syntax = "proto3";

option csharp_namespace = "OrderServiceGrpc.Protos";

import "google/protobuf/timestamp.proto";

// ===================== Messages =====================

message CartMessage {
  int64 id = 1;
  int32 user_id = 2;
  int32 product_id = 3;
  int32 quantity = 4;
  string unit_price = 5;

  int32 created_by = 6;
  google.protobuf.Timestamp created_date = 7;

  bool is_deleted = 8;
}

message CartUpsertMessage {
  int64 id = 1;
  int32 product_id = 2;
  int32 quantity = 3;
  string unit_price = 4;
}

// ---- Request messages ----

message AddToCartRequest {
  CartUpsertMessage cart = 1;
}

message UpdateCartItemRequest {
  CartUpsertMessage cart = 1;
}

message RemoveFromCartRequest {
  int64 cart_id = 1;
}

message ViewCartRequest {
}

// ---- Response messages ----

message CartResponse {
  bool success = 1;
  string message = 2;
  CartMessage cart = 3;
}

message RemoveFromCartResponse {
  bool success = 1;
  string message = 2;
}

message CartListResponse {
  bool success = 1;
  string message = 2;
  repeated CartMessage items = 3;
}

// ===================== Service =====================

service CartService {
  rpc AddToCart (AddToCartRequest) returns (CartResponse);
  rpc UpdateCartItem (UpdateCartItemRequest) returns (CartResponse);
  rpc RemoveFromCart (RemoveFromCartRequest) returns (RemoveFromCartResponse);
  rpc ViewCart (ViewCartRequest) returns (CartListResponse);
}
